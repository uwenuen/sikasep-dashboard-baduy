{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SI-KASEP Baduy</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header Card -->
        <div class="bg-[#0c2335] text-white p-6 text-center">
            <div class="inline-block bg-white p-2 rounded-full mb-3 shadow-md">
                <img src="{% static 'images/logo.png' %}" alt="Logo SI-KASEP" class="w-16 h-16 object-contain">
            </div>
            <h2 class="text-2xl font-bold tracking-wide">SI-KASEP Baduy</h2>
            <p class="text-xs text-blue-200 mt-1">Pendaftaran Akun Baru Dashboard</p>
        </div>

        <!-- Form Body -->
        <div class="p-6">
            <h3 class="text-lg font-bold text-slate-800 text-center mb-6">Buat Akun Baru (Sign Up)</h3>

            {% if messages %}
                <div class="space-y-2 mb-4">
                {% for message in messages %}
                    <div class="p-3 rounded-lg text-xs font-semibold {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
                        <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %} mr-1.5"></i>
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required
                               placeholder="Buat username"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0c2335] focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email <span class="text-slate-400 font-normal lowercase">(opsional)</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email"
                               placeholder="nama@email.com"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0c2335] focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required
                               placeholder="Buat password"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0c2335] focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Konfirmasi Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </span>
                        <input type="password" name="confirm_password" required
                               placeholder="Ulangi password"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0c2335] focus:bg-white transition">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3 bg-[#0c2335] hover:bg-[#16365d] text-white font-bold rounded-xl shadow-md transition duration-200 text-sm mt-2">
                    Daftar Akun (Sign Up)
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
                Sudah memiliki akun? 
                <a href="{% url 'login' %}" class="font-bold text-[#0c2335] hover:underline ml-1">
                    Masuk (Login)
                </a>
            </div>
        </div>

    </div>

</body>
</html>
